services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    restart: unless-stopped
    volumes:
      - mariadb_volume:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u $$MYSQL_USER -p$$(cat /run/secrets/db_password)"]
      interval: 2s
      timeout: 5s
      retries: 30

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password
    restart: unless-stopped
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_volume:/var/www/html

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    ports:
      - "443:443"
    restart: unless-stopped
    networks:
      - inception
    depends_on:
      - wordpress
    volumes:
      - wordpress_volume:/var/www/html

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
volumes:
  mariadb_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/alubrano/data/mariadb
  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/alubrano/data/wordpress

networks:
  inception:
    driver: bridge

